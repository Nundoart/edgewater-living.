name: Daily Edgewater inventory
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: edgewater-inventory
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.TRUEHOMES_IMPORT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report reader
        run: python -m pip install requests==2.32.5 requests-ntlm==1.3.0 pdfplumber==0.11.7
      - name: Refresh previously verified homes
        env:
          TRUEHOMES_USERNAME: ${{ secrets.TRUEHOMES_USERNAME }}
          TRUEHOMES_PASSWORD: ${{ secrets.TRUEHOMES_PASSWORD }}
        run: python scripts/import_inventory.py
      - name: Save changed inventory
        run: |
          if git diff --quiet -- listings.json; then exit 0; fi
          git config user.name 'Nundoart'
          git config user.email 'linebergerm01@gmail.com'
          git add listings.json
          git commit -m 'Refresh Edgewater inventory from authorized True Homes report'
          git push origin HEAD:main
